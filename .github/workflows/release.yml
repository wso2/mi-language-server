# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: release

on: workflow_dispatch

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
    - name: Check out code
      uses: actions/checkout@v3
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'
        cache: 'maven'
    - name: Build on Linux
      if: runner.os == 'Linux'
      run: ./mvnw -B clean install

    - name: Get version
      id: ls
      run: |
        filePath=$(ls org.eclipse.lemminx/target/mi-language-server-*.jar | grep -v tests | head -n 1)
        file=$(basename "$filePath")
        fileName=${file%.jar}
        version=${fileName#mi-language-server-}

        echo $version
        echo "version=$version" >> $GITHUB_OUTPUT
        echo "fileName=$fileName" >> $GITHUB_OUTPUT

    - name: zip the LS files
      run: zip -r ${{ steps.ls.outputs.fileName }}.zip org.eclipse.lemminx/target/*.jar -x org.eclipse.lemminx/target/*tests.jar -y

    - name: Save ls
      uses: actions/upload-artifact@v4
      id: artifact-upload
      with:
        path: ${{ steps.ls.outputs.fileName }}.zip
        name: ${{ steps.ls.outputs.fileName }}.zip
    - name: Create a release in repo
      run: |
        echo "Creating release..."
    
        createResponse=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
          -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: Bearer ${{ secrets.GIT_BOT_TOKEN }}" \
          -H "Content-Type: application/json" \
          https://api.github.com/repos/${{ github.repository }}/releases \
          -d "{
            \"tag_name\": \"v${{ steps.ls.outputs.version }}\",
            \"name\": \"Release v${{ steps.ls.outputs.version }}\",
            \"draft\": false,
            \"prerelease\": true
          }")
    
        echo "$createResponse"
    
        id=$(echo "$createResponse" | jq -r '.id')
    
        if [ "$id" = "null" ] || [ -z "$id" ]; then
          echo "❌ Failed to create release"
          exit 1
        fi
    
        echo "✅ Release ID: $id"
    
        echo "Uploading asset..."
    
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.GIT_BOT_TOKEN }}" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @${{ steps.ls.outputs.fileName }}.zip \
          "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=${{ steps.ls.outputs.fileName }}.zip"
